<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>dsh-videocall · 通话</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #0f1115; color: #e8eaed; }
  header { padding: 12px 16px; border-bottom: 1px solid #23262d; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .tag { font-size: 12px; color: #9aa0a6; }
  #notice { display: none; padding: 8px 16px; background: #2a2312; color: #f7d67a; border-bottom: 1px solid #4a3d16; font-size: 13px; }
  main { padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; }
  .stage { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
  #remote { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #localBadge { position: absolute; right: 10px; bottom: 10px; width: 116px; max-height: 150px; border-radius: 8px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.5); background: #000; }
  #localBadge.hidden { display: none; }
  #local { width: 100%; height: 100%; max-height: 150px; object-fit: cover; display: block; }
  #btnHideLocal { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; padding: 0; border-radius: 50%; background: rgba(0,0,0,.62); color: #fff; border: 0; font-size: 11px; line-height: 20px; cursor: pointer; }
  #btnShowLocal { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.62); color: #e8eaed; border: 1px solid #31353e; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .hidden { display: none !important; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: #161920; border: 1px solid #23262d; border-radius: 12px; padding: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { border: 1px solid #31353e; background: #1d222b; color: #e8eaed; padding: 8px 12px; border-radius: 9px; font: inherit; cursor: pointer; }
  button:hover { background: #252b36; }
  button.primary { background: #2f6b4f; border-color: #3c8a66; }
  button.danger { background: #5a2530; border-color: #7a3242; }
  select, input { width: 100%; padding: 8px; border-radius: 9px; border: 1px solid #31353e; background: #11141a; color: inherit; font: inherit; }
  label { font-size: 12px; color: #9aa0a6; display: block; margin-bottom: 4px; }
  #log { margin: 0; padding: 0; list-style: none; font: 12px/1.6 ui-monospace, Consolas, monospace; color: #9aa0a6; max-height: 180px; overflow: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; display: inline-block; margin-right: 6px; }
  .dot.on { background: #4ade80; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } .stage { aspect-ratio: 4/3; } }
</style>
</head>
<body>
<header>
  <h1>dsh-videocall</h1>
  <span class="tag"><span id="dot" class="dot"></span><span id="peerInfo">未连接</span></span>
  <span class="tag" id="roomInfo"></span>
</header>
<div id="notice"></div>

<main>
  <section class="stage">
    <video id="remote" autoplay playsinline></video>
    <div id="localBadge">
      <video id="local" autoplay playsinline muted></video>
      <button id="btnHideLocal" title="隐藏我的画面" aria-label="隐藏我的画面">✕</button>
    </div>
    <button id="btnShowLocal" class="hidden" title="显示我的画面">我的画面</button>
  </section>

  <aside>
    <div class="card">
      <label for="camSelect">助手画面源（VTS 皮套 → OBS 虚拟摄像头）</label>
      <select id="camSelect"><option value="">先点「授权设备」</option></select>
      <div class="row" style="margin-top:8px">
        <button id="btnDevices">授权设备</button>
        <button id="btnStart" class="primary">开始通话</button>
        <button id="btnHangup" class="danger">挂断</button>
      </div>
    </div>

    <div class="card">
      <label>TTS / 测试音（零驱动音频轨）</label>
      <div class="row">
        <button id="btnTone">播一段测试音</button>
        <button id="btnStopTone">停</button>
      </div>
      <div style="margin-top:8px">
        <label><input type="checkbox" id="chkFrame" style="width:auto" /> 持续抽帧回传（低画质，看轮廓）</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btnHiRes">拉一帧高清</button>
      </div>
    </div>

    <div class="card">
      <label>日志</label>
      <ul id="log"></ul>
    </div>
  </aside>
</main>

<script type="module" src="/call.js"></script>
</body>
</html>
